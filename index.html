<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>เพลย์ลิสต์ของฉัน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans+Thai:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F8F5;
    --ink:#1E2B22;
    --ink-soft:#4C5C51;
    --sage:#6E8F78;
    --sage-deep:#3F5844;
    --mint-pale:#E6EFE4;
    --line:#DAE2D6;
    --radius-s:3px;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans','IBM Plex Sans Thai',sans-serif;
    -webkit-font-smoothing:antialiased;
    height:100%;
  }

  body{
    display:flex;
    flex-direction:column;
    min-height:100svh;
  }

  /* ---------- header / playlist tabs ---------- */

  header{
    padding:20px 20px 0 20px;
    max-width:640px;
    width:100%;
    margin:0 auto;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:22px;
  }

  .brand-mark{
    width:9px;
    height:9px;
    border-radius:50%;
    background:var(--sage);
    flex-shrink:0;
  }

  .brand-name{
    font-size:13.5px;
    color:var(--ink-soft);
    letter-spacing:0.02em;
  }

  .tabs{
    display:flex;
    gap:22px;
    overflow-x:auto;
    padding-bottom:14px;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{ display:none; }

  .tab{
    background:none;
    border:none;
    font-family:inherit;
    font-size:14.5px;
    color:var(--ink-soft);
    padding:0 0 10px 0;
    white-space:nowrap;
    cursor:pointer;
    border-bottom:2px solid transparent;
  }

  .tab.active{
    color:var(--ink);
    border-bottom-color:var(--sage);
  }

  hr.top-line{
    border:none;
    border-top:1px solid var(--line);
    margin:0;
  }

  /* ---------- main track list ---------- */

  main{
    flex:1;
    max-width:640px;
    width:100%;
    margin:0 auto;
    padding:28px 20px 210px 20px;
  }

  .playlist-heading{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:30px;
    line-height:1.15;
    margin:0 0 4px 0;
  }

  .playlist-meta{
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:26px;
  }

  ul.tracklist{
    list-style:none;
    margin:0;
    padding:0;
    border-top:1px solid var(--line);
  }

  li.track{
    display:flex;
    align-items:center;
    gap:16px;
    padding:15px 6px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
  }

  li.track:hover .track-title{
    color:var(--sage-deep);
  }

  li.track.playing{
    background:var(--mint-pale);
    margin:0 -6px;
    padding-left:12px;
    padding-right:12px;
    border-bottom-color:var(--mint-pale);
  }
  li.track.playing + li.track{
    border-top:none;
  }

  .track-index{
    font-size:13px;
    color:var(--ink-soft);
    width:20px;
    flex-shrink:0;
    font-variant-numeric:tabular-nums;
  }

  li.track.playing .track-index{
    color:var(--sage-deep);
  }

  .track-title{
    font-size:15.5px;
    flex:1;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .track-icon{
    width:16px;
    height:16px;
    flex-shrink:0;
    color:var(--sage-deep);
    display:none;
  }
  li.track.playing .track-icon{ display:block; }

  /* ---------- player bar ---------- */

  .player{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    background:var(--paper);
    border-top:1px solid var(--line);
    padding:14px 20px 18px 20px;
  }

  .player-inner{
    max-width:640px;
    margin:0 auto;
  }

  .now-playing{
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:2px;
  }

  .now-playing-title{
    font-family:'Fraunces', serif;
    font-size:17px;
    color:var(--ink);
    margin-bottom:10px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .now-playing-error{
    font-size:12.5px;
    color:#A15A3D;
    margin:-6px 0 10px 0;
  }

  .seek-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
  }

  .time{
    font-size:11.5px;
    color:var(--ink-soft);
    font-variant-numeric:tabular-nums;
    width:36px;
    flex-shrink:0;
  }
  .time.end{ text-align:right; }

  input[type="range"]{
    -webkit-appearance:none;
    appearance:none;
    flex:1;
    height:2px;
    background:var(--line);
    border-radius:2px;
    outline:none;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:11px;
    height:11px;
    border-radius:50%;
    background:var(--sage-deep);
    cursor:pointer;
    margin-top:0;
  }
  input[type="range"]::-moz-range-thumb{
    width:11px;
    height:11px;
    border:none;
    border-radius:50%;
    background:var(--sage-deep);
    cursor:pointer;
  }

  .controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:28px;
  }

  .ctrl-btn{
    background:none;
    border:none;
    color:var(--ink);
    cursor:pointer;
    padding:6px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .ctrl-btn svg{ width:20px; height:20px; }

  .play-btn{
    width:48px;
    height:48px;
    border-radius:50%;
    background:var(--sage-deep);
    color:var(--paper);
    display:flex;
    align-items:center;
    justify-content:center;
    border:none;
    cursor:pointer;
  }
  .play-btn svg{ width:18px; height:18px; }

  .repeat-btn{
    color:var(--ink-soft);
  }
  .repeat-btn.on{
    color:var(--sage-deep);
  }

  @media (min-width:640px){
    .playlist-heading{ font-size:34px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="brand-mark"></span>
    <span class="brand-name">เพลย์ลิสต์ของฉัน</span>
  </div>
  <div class="tabs" id="tabs"></div>
</header>
<hr class="top-line">

<main>
  <h1 class="playlist-heading" id="playlistName"></h1>
  <div class="playlist-meta" id="playlistMeta"></div>
  <ul class="tracklist" id="tracklist"></ul>
</main>

<div class="player">
  <div class="player-inner">
    <div class="now-playing" id="nowPlayingLabel">ยังไม่ได้เล่นเพลง</div>
    <div class="now-playing-title" id="nowPlayingTitle">เลือกเพลงจากรายการด้านบน</div>
    <div class="now-playing-error" id="nowPlayingError" style="display:none;"></div>

    <div class="seek-row">
      <span class="time" id="timeCurrent">0:00</span>
      <input type="range" id="seek" min="0" max="100" value="0">
      <span class="time end" id="timeTotal">0:00</span>
    </div>

    <div class="controls">
      <button class="ctrl-btn repeat-btn" id="repeatBtn" title="วนซ้ำเพลย์ลิสต์">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
      </button>

      <button class="ctrl-btn" id="prevBtn" title="เพลงก่อนหน้า">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM20 6v12L9 12z"/></svg>
      </button>

      <button class="play-btn" id="playBtn" title="เล่น/หยุด">
        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>

      <button class="ctrl-btn" id="nextBtn" title="เพลงถัดไป">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 6h-2v12h2zM4 6v12l11-6z"/></svg>
      </button>

      <span style="width:32px"></span>
    </div>
  </div>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
  // ---------- data ----------
  // โหมดที่ 1 (per-track): แต่ละเพลงมีไฟล์ของตัวเอง ใส่ field "file" ที่แต่ละเพลง
  // โหมดที่ 2 (merged): ทั้งเพลย์ลิสต์รวมเป็นไฟล์เดียว ใส่ field "file" ที่ตัวเพลย์ลิสต์ + "start" (วินาที) ที่แต่ละเพลงแทน
  // เพิ่มเพลย์ลิสต์ใหม่ได้โดยเพิ่มอ็อบเจกต์ในอาเรย์นี้ — จะใช้โหมดไหนก็ได้ ไม่ต้องเหมือนกันทุกเพลย์ลิสต์
  const playlists = [
    {
      id: "playlist-1",
      name: "Playlist 1",
      tracks: [
        { title: "A day like this", file: "01.mp3" },
        { title: "After a long day", file: "02.mp3" },
        { title: "After Two Glasses of Red", file: "03.mp3" },
        { title: "And Suddenly", file: "04.mp3" },
        { title: "Borrowed Afternoon", file: "05.mp3" },
        { title: "Done for today", file: "06.mp3" },
        { title: "Five minute break", file: "07.mp3" },
        { title: "Forty Feels Funny", file: "08.mp3" },
        { title: "Here in Human Form", file: "09.mp3" },
        { title: "Hidden in the seed", file: "10.mp3" },
        { title: "If You Let It", file: "11.mp3" },
        { title: "In Hindsight", file: "12.mp3" },
        { title: "In the Flow", file: "13.mp3" },
        { title: "It always works out♡", file: "14.mp3" },
        { title: "Just feels right", file: "15.mp3" },
        { title: "Let it pass", file: "16.mp3" },
        { title: "Life Can Be Easy", file: "17.mp3" },
        { title: "Liminality (In Between)", file: "18.mp3" },
        { title: "LUCKY LIKE THAT", file: "19.mp3" },
        { title: "Maybe This Is It", file: "20.mp3" }
      ]
    },
    {
      id: "playlist-2",
      name: "Playlist 2",
      tracks: [
        { title: "It is safe", file: "p2-01.mp3" },
        { title: "Old Addresses", file: "p2-02.mp3" },
        { title: "Peace Is the New Dream", file: "p2-03.mp3" },
        { title: "Permission Slip", file: "p2-04.mp3" },
        { title: "Right here, right now", file: "p2-05.mp3" },
        { title: "Silly You (Remastered)", file: "p2-06.mp3" },
        { title: "Recalculate", file: "p2-07.mp3" },
        { title: "Say It Before Your Body Does", file: "p2-08.mp3" },
        { title: "Still Me", file: "p2-09.mp3" },
        { title: "Someone's Good Luck", file: "p2-10.mp3" },
        { title: "Still lucky", file: "p2-11.mp3" },
        { title: "Still not too late", file: "p2-12.mp3" },
        { title: "Still There", file: "p2-13.mp3" },
        { title: "Rinse", file: "p2-14.mp3" },
        { title: "Risk it", file: "p2-15.mp3" },
        { title: "Play the game", file: "p2-16.mp3" },
        { title: "Some days are really good", file: "p2-17.mp3" },
        { title: "Not Everything Is About You", file: "p2-18.mp3" },
        { title: "Still We Rise and Thrive", file: "p2-19.mp3" },
        { title: "Staying Happy", file: "p2-20.mp3" }
      ]
    }
  ];

  // ---------- state ----------
  let currentPlaylistIndex = 0;
  let currentTrackIndex = -1;
  let repeatPlaylist = false;
  let loadedPlaylistIndex = -1; // ไฟล์เสียงที่โหลดอยู่ตอนนี้เป็นของเพลย์ลิสต์ไหน

  const audio = document.getElementById("audio");
  const tabsEl = document.getElementById("tabs");
  const playlistNameEl = document.getElementById("playlistName");
  const playlistMetaEl = document.getElementById("playlistMeta");
  const tracklistEl = document.getElementById("tracklist");
  const nowPlayingLabel = document.getElementById("nowPlayingLabel");
  const nowPlayingTitle = document.getElementById("nowPlayingTitle");
  const nowPlayingError = document.getElementById("nowPlayingError");
  const playBtn = document.getElementById("playBtn");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const repeatBtn = document.getElementById("repeatBtn");
  const seek = document.getElementById("seek");
  const timeCurrent = document.getElementById("timeCurrent");
  const timeTotal = document.getElementById("timeTotal");

  const ICON_PLAY = '<path d="M8 5v14l11-7z"/>';
  const ICON_PAUSE = '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';

  function formatTime(sec){
    if(!isFinite(sec) || sec < 0) return "0:00";
    const m = Math.floor(sec/60);
    const s = Math.floor(sec%60).toString().padStart(2,"0");
    return m+":"+s;
  }

  function isMerged(pl){
    return !!pl.file;
  }

  function trackEnd(playlist, index){
    return index < playlist.tracks.length - 1
      ? playlist.tracks[index+1].start
      : (audio.duration && isFinite(audio.duration) ? audio.duration : Infinity);
  }

  function showError(msg){
    nowPlayingError.textContent = msg;
    nowPlayingError.style.display = "block";
  }
  function clearError(){
    nowPlayingError.style.display = "none";
    nowPlayingError.textContent = "";
  }

  function setPlayIcon(playing){
    const el = document.getElementById("playIcon");
    if(el) el.outerHTML = '<svg id="playIcon" viewBox="0 0 24 24" fill="currentColor">'+(playing ? ICON_PAUSE : ICON_PLAY)+'</svg>';
  }

  function renderTabs(){
    tabsEl.innerHTML = "";
    playlists.forEach((pl, i) => {
      const btn = document.createElement("button");
      btn.className = "tab" + (i===currentPlaylistIndex ? " active" : "");
      btn.textContent = pl.name;
      btn.onclick = () => playPlaylistFromStart(i);
      tabsEl.appendChild(btn);
    });
  }

  function renderPlaylist(){
    const pl = playlists[currentPlaylistIndex];
    playlistNameEl.textContent = pl.name;
    playlistMetaEl.textContent = pl.tracks.length + " เพลง";

    tracklistEl.innerHTML = "";
    pl.tracks.forEach((track, i) => {
      const li = document.createElement("li");
      li.className = "track" + (i===currentTrackIndex ? " playing" : "");
      li.innerHTML =
        '<span class="track-index">' + (i+1).toString().padStart(2,"0") + '</span>' +
        '<span class="track-title">' + track.title + '</span>' +
        '<svg class="track-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
      li.onclick = () => playTrack(currentPlaylistIndex, i);
      tracklistEl.appendChild(li);
    });
  }

  function renderAll(){
    renderTabs();
    renderPlaylist();
  }

  function updateNowPlayingUI(){
    const pl = playlists[currentPlaylistIndex];
    const track = pl.tracks[currentTrackIndex];
    nowPlayingLabel.textContent = "กำลังเล่นจาก " + pl.name;
    nowPlayingTitle.textContent = track.title;

    if(isMerged(pl)){
      const dur = trackEnd(pl, currentTrackIndex) - track.start;
      seek.max = isFinite(dur) ? dur : 0;
      timeTotal.textContent = formatTime(dur);
    } else {
      const dur = audio.duration;
      seek.max = (dur && isFinite(dur)) ? dur : 0;
      timeTotal.textContent = formatTime(dur);
    }
  }

  // เล่นเพลงที่ระบุ — โหมด merged จะกระโดดตำแหน่งในไฟล์รวม, โหมด per-track จะโหลดไฟล์ของเพลงนั้นแยก
  function playTrack(playlistIndex, trackIndex){
    currentPlaylistIndex = playlistIndex;
    currentTrackIndex = trackIndex;
    const pl = playlists[playlistIndex];
    const track = pl.tracks[trackIndex];

    clearError();

    if(isMerged(pl)){
      if(loadedPlaylistIndex !== playlistIndex){
        audio.src = pl.file;
        loadedPlaylistIndex = playlistIndex;
        audio.addEventListener("loadedmetadata", function onLoaded(){
          audio.currentTime = track.start;
          audio.play().catch((err) => {
            showError("เล่นเพลย์ลิสต์นี้ไม่ได้ — เช็คว่าอัปโหลดไฟล์ " + pl.file + " ขึ้น GitHub แล้วหรือยัง");
          });
          updateNowPlayingUI();
          audio.removeEventListener("loadedmetadata", onLoaded);
        });
      } else {
        audio.currentTime = track.start;
        audio.play().catch((err) => {
          showError("เล่นเพลงนี้ไม่ได้ (" + track.title + ")");
        });
      }
    } else {
      audio.src = track.file;
      loadedPlaylistIndex = playlistIndex;
      audio.play().catch((err) => {
        showError("เล่นเพลงนี้ไม่ได้ (" + track.title + ") — เช็คว่าอัปโหลดไฟล์ " + track.file + " ขึ้น GitHub แล้วหรือยัง");
      });
    }

    updateNowPlayingUI();
    renderPlaylist();
  }

  function playPlaylistFromStart(playlistIndex){
    audio.pause();
    if(playlists[playlistIndex].tracks.length > 0){
      playTrack(playlistIndex, 0);
    }
  }

  function togglePlay(){
    if(currentTrackIndex === -1){
      playPlaylistFromStart(currentPlaylistIndex);
      return;
    }
    if(audio.paused){
      audio.play().catch(()=>{});
    } else {
      audio.pause();
    }
  }

  function playNext(){
    const tracks = playlists[currentPlaylistIndex].tracks;
    if(currentTrackIndex < tracks.length - 1){
      playTrack(currentPlaylistIndex, currentTrackIndex + 1);
    } else if(repeatPlaylist){
      playTrack(currentPlaylistIndex, 0);
    } else {
      audio.pause();
    }
  }

  function playPrev(){
    const pl = playlists[currentPlaylistIndex];
    const track = pl.tracks[currentTrackIndex];
    const trackStart = track.start || 0;
    if(audio.currentTime - trackStart > 3){
      audio.currentTime = trackStart;
      return;
    }
    if(currentTrackIndex > 0){
      playTrack(currentPlaylistIndex, currentTrackIndex - 1);
    } else {
      audio.currentTime = trackStart;
    }
  }

  // ---------- events ----------
  playBtn.onclick = togglePlay;
  nextBtn.onclick = playNext;
  prevBtn.onclick = playPrev;

  repeatBtn.onclick = () => {
    repeatPlaylist = !repeatPlaylist;
    repeatBtn.classList.toggle("on", repeatPlaylist);
  };

  audio.addEventListener("play", () => setPlayIcon(true));
  audio.addEventListener("pause", () => setPlayIcon(false));

  // per-track mode: ไฟล์เพลงนี้จบ → ไปเพลงถัดไป (โหลดไฟล์ใหม่)
  // merged mode: ไฟล์ทั้งไฟล์จบ (เพลงสุดท้ายของเพลย์ลิสต์จบแล้ว) → วนซ้ำถ้าเปิดไว้
  audio.addEventListener("ended", () => {
    const pl = playlists[currentPlaylistIndex];
    if(!pl) return;
    if(isMerged(pl)){
      if(repeatPlaylist){
        playTrack(currentPlaylistIndex, 0);
      }
    } else {
      playNext();
    }
  });

  audio.addEventListener("error", () => {
    const pl = playlists[currentPlaylistIndex];
    const track = pl ? pl.tracks[currentTrackIndex] : null;
    if(!pl) return;
    if(isMerged(pl)){
      showError("โหลดเพลย์ลิสต์นี้ไม่ได้ — เช็คว่าไฟล์ " + pl.file + " อยู่ใน repo แล้วหรือยัง");
    } else if(track){
      showError("โหลดเพลงนี้ไม่ได้ (" + track.title + ") — เช็คว่าไฟล์ " + track.file + " อยู่ใน repo แล้วหรือยัง");
    }
  });

  // ทุกครั้งที่เวลาขยับ — merged mode: เช็คว่าข้ามเข้าเพลงถัดไปในไฟล์รวมหรือยัง แล้วอัปเดตหน้าจอให้ตรง
  // per-track mode: อัปเดตแถบเวลาตามปกติ (แต่ละเพลงคือไฟล์ของตัวเอง ไม่ต้องคำนวณ offset)
  audio.addEventListener("timeupdate", () => {
    const pl = playlists[currentPlaylistIndex];
    if(!pl || currentTrackIndex === -1) return;

    if(isMerged(pl)){
      while(currentTrackIndex < pl.tracks.length - 1 && audio.currentTime >= trackEnd(pl, currentTrackIndex) - 0.05){
        currentTrackIndex++;
        updateNowPlayingUI();
        renderPlaylist();
      }
      const track = pl.tracks[currentTrackIndex];
      const posInTrack = audio.currentTime - track.start;
      if(!seek.matches(":active")){
        seek.value = posInTrack;
      }
      timeCurrent.textContent = formatTime(posInTrack);
    } else {
      if(!seek.matches(":active")){
        seek.value = audio.currentTime;
      }
      timeCurrent.textContent = formatTime(audio.currentTime);
    }
  });

  seek.addEventListener("input", () => {
    const pl = playlists[currentPlaylistIndex];
    if(isMerged(pl)){
      const track = pl.tracks[currentTrackIndex];
      audio.currentTime = track.start + Number(seek.value);
    } else {
      audio.currentTime = Number(seek.value);
    }
  });

  audio.addEventListener("loadedmetadata", () => {
    const pl = playlists[currentPlaylistIndex];
    if(pl && !isMerged(pl)){
      seek.max = audio.duration || 0;
      timeTotal.textContent = formatTime(audio.duration);
    }
  });

  // media session (ปุ่มควบคุมที่หน้าจอล็อก)
  if("mediaSession" in navigator){
    navigator.mediaSession.setActionHandler("play", togglePlay);
    navigator.mediaSession.setActionHandler("pause", togglePlay);
    navigator.mediaSession.setActionHandler("previoustrack", playPrev);
    navigator.mediaSession.setActionHandler("nexttrack", playNext);
  }

  renderAll();
</script>

</body>
