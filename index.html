<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>เพลย์ลิสต์ของฉัน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans+Thai:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F8F5;
    --ink:#1E2B22;
    --ink-soft:#4C5C51;
    --sage:#6E8F78;
    --sage-deep:#3F5844;
    --mint-pale:#E6EFE4;
    --line:#DAE2D6;
    --radius-s:3px;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans','IBM Plex Sans Thai',sans-serif;
    -webkit-font-smoothing:antialiased;
    height:100%;
  }

  body{
    display:flex;
    flex-direction:column;
    min-height:100svh;
  }

  /* ---------- header / playlist tabs ---------- */

  header{
    padding:20px 20px 0 20px;
    max-width:640px;
    width:100%;
    margin:0 auto;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:22px;
  }

  .brand-mark{
    width:9px;
    height:9px;
    border-radius:50%;
    background:var(--sage);
    flex-shrink:0;
  }

  .brand-name{
    font-size:13.5px;
    color:var(--ink-soft);
    letter-spacing:0.02em;
  }

  .tabs{
    display:flex;
    gap:22px;
    overflow-x:auto;
    padding-bottom:14px;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{ display:none; }

  .tab{
    background:none;
    border:none;
    font-family:inherit;
    font-size:14.5px;
    color:var(--ink-soft);
    padding:0 0 10px 0;
    white-space:nowrap;
    cursor:pointer;
    border-bottom:2px solid transparent;
  }

  .tab.active{
    color:var(--ink);
    border-bottom-color:var(--sage);
  }

  hr.top-line{
    border:none;
    border-top:1px solid var(--line);
    margin:0;
  }

  /* ---------- main track list ---------- */

  main{
    flex:1;
    max-width:640px;
    width:100%;
    margin:0 auto;
    padding:28px 20px 140px 20px;
  }

  .playlist-heading{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:30px;
    line-height:1.15;
    margin:0 0 4px 0;
  }

  .playlist-meta{
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:26px;
  }

  ul.tracklist{
    list-style:none;
    margin:0;
    padding:0;
    border-top:1px solid var(--line);
  }

  li.track{
    display:flex;
    align-items:center;
    gap:16px;
    padding:15px 6px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
  }

  li.track:hover .track-title{
    color:var(--sage-deep);
  }

  li.track.playing{
    background:var(--mint-pale);
    margin:0 -6px;
    padding-left:12px;
    padding-right:12px;
    border-bottom-color:var(--mint-pale);
  }
  li.track.playing + li.track{
    border-top:none;
  }

  .track-index{
    font-size:13px;
    color:var(--ink-soft);
    width:20px;
    flex-shrink:0;
    font-variant-numeric:tabular-nums;
  }

  li.track.playing .track-index{
    color:var(--sage-deep);
  }

  .track-title{
    font-size:15.5px;
    flex:1;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .track-icon{
    width:16px;
    height:16px;
    flex-shrink:0;
    color:var(--sage-deep);
    display:none;
  }
  li.track.playing .track-icon{ display:block; }

  /* ---------- player bar ---------- */

  .player{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    background:var(--paper);
    border-top:1px solid var(--line);
    padding:14px 20px 18px 20px;
  }

  .player-inner{
    max-width:640px;
    margin:0 auto;
  }

  .now-playing{
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:2px;
  }

  .now-playing-title{
    font-family:'Fraunces', serif;
    font-size:17px;
    color:var(--ink);
    margin-bottom:10px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .now-playing-error{
    font-size:12.5px;
    color:#A15A3D;
    margin:-6px 0 10px 0;
  }

  .seek-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
  }

  .time{
    font-size:11.5px;
    color:var(--ink-soft);
    font-variant-numeric:tabular-nums;
    width:36px;
    flex-shrink:0;
  }
  .time.end{ text-align:right; }

  input[type="range"]{
    -webkit-appearance:none;
    appearance:none;
    flex:1;
    height:2px;
    background:var(--line);
    border-radius:2px;
    outline:none;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:11px;
    height:11px;
    border-radius:50%;
    background:var(--sage-deep);
    cursor:pointer;
    margin-top:0;
  }
  input[type="range"]::-moz-range-thumb{
    width:11px;
    height:11px;
    border:none;
    border-radius:50%;
    background:var(--sage-deep);
    cursor:pointer;
  }

  .controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:28px;
  }

  .ctrl-btn{
    background:none;
    border:none;
    color:var(--ink);
    cursor:pointer;
    padding:6px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .ctrl-btn svg{ width:20px; height:20px; }

  .play-btn{
    width:48px;
    height:48px;
    border-radius:50%;
    background:var(--sage-deep);
    color:var(--paper);
    display:flex;
    align-items:center;
    justify-content:center;
    border:none;
    cursor:pointer;
  }
  .play-btn svg{ width:18px; height:18px; }

  .repeat-btn{
    color:var(--ink-soft);
  }
  .repeat-btn.on{
    color:var(--sage-deep);
  }

  @media (min-width:640px){
    .playlist-heading{ font-size:34px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="brand-mark"></span>
    <span class="brand-name">เพลย์ลิสต์ของฉัน</span>
  </div>
  <div class="tabs" id="tabs"></div>
</header>
<hr class="top-line">

<main>
  <h1 class="playlist-heading" id="playlistName"></h1>
  <div class="playlist-meta" id="playlistMeta"></div>
  <ul class="tracklist" id="tracklist"></ul>
</main>

<div class="player">
  <div class="player-inner">
    <div class="now-playing" id="nowPlayingLabel">ยังไม่ได้เล่นเพลง</div>
    <div class="now-playing-title" id="nowPlayingTitle">เลือกเพลงจากรายการด้านบน</div>
    <div class="now-playing-error" id="nowPlayingError" style="display:none;"></div>

    <div class="seek-row">
      <span class="time" id="timeCurrent">0:00</span>
      <input type="range" id="seek" min="0" max="100" value="0">
      <span class="time end" id="timeTotal">0:00</span>
    </div>

    <div class="controls">
      <button class="ctrl-btn repeat-btn" id="repeatBtn" title="วนซ้ำเพลย์ลิสต์">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
      </button>

      <button class="ctrl-btn" id="prevBtn" title="เพลงก่อนหน้า">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM20 6v12L9 12z"/></svg>
      </button>

      <button class="play-btn" id="playBtn" title="เล่น/หยุด">
        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>

      <button class="ctrl-btn" id="nextBtn" title="เพลงถัดไป">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 6h-2v12h2zM4 6v12l11-6z"/></svg>
      </button>

      <span style="width:32px"></span>
    </div>
  </div>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
  // ---------- data ----------
  // เพิ่มเพลย์ลิสต์ใหม่ได้โดยเพิ่มอ็อบเจกต์ในอาเรย์นี้
  const playlists = [
    {
      id: "playlist-1",
      name: "Playlist 1",
      tracks: [
        { title: "A day like this", driveId: "13hyehzj6yFrPVKy3mqFvmAf06d3g1Ug8" },
        { title: "After a long day", driveId: "1el27yY1bliDnOaTo-vI1e8iJ7WrG9W-z" },
        { title: "After Two Glasses of Red", driveId: "1UZEm4mgn-MfkA_aWZpvqwyMWRiK5DSXs" },
        { title: "And Suddenly", driveId: "1OgONIxrCFYBHwTDk89jlUxSzgr4Nbcr3" },
        { title: "Borrowed Afternoon", driveId: "1QByws7yLIB7bB4odenUqD40tNSD_tBai" },
        { title: "Done for today", driveId: "1gS2iiGHvNAemNrx9rtyTniddRrnCCdyf" },
        { title: "Five minute break", driveId: "17zEOZTFk4ItoY2tbcJPqH8cLVlGN96Tb" },
        { title: "Forty Feels Funny", driveId: "1V1vLZP7yW3bQOVoIduJV-72LKylJSWJW" },
        { title: "Here in Human Form", driveId: "1GgmHTrkmTdK7YYgoFRoR60aCR7PAhMdu" },
        { title: "Hidden in the seed", driveId: "1uFNMGUwfQP5uNft6mXTpc037cuyikaOK" },
        { title: "If You Let It", driveId: "1I0aEiUkBq35chLGzlb8JuTAE5n6tFrm2" },
        { title: "In Hindsight", driveId: "10BvObefhpWXfmnPVAdLmfKDdrUBs4urW" },
        { title: "In the Flow", driveId: "1wOSOIiMRmY6r4vCWoTp3qdjo11UAiy9R" },
        { title: "It always works out♡", driveId: "1irKfzT88NjC_13zdduCjL5huKtMnodIt" },
        { title: "Just feels right", driveId: "1MN3PeW9JG8ee8a_ZjirRr9YfUwWSasSb" },
        { title: "Let it pass", driveId: "1I8QCj_W61PLYxFOnYq5hmjAsZy2d9utp" },
        { title: "Life Can Be Easy", driveId: "18bwXsKtFdlptuIH38viH6LtNKYuAxNhv" },
        { title: "Liminality (In Between)", driveId: "1d-icIZJQLeBpK8OHqzFOBhcpzKpN4VnZ" },
        { title: "LUCKY LIKE THAT", driveId: "1OZeoMzVQ3RfhVO53Y2M96Z03BmP7Yl1a" },
        { title: "Maybe This Is It", driveId: "1ll2erO3tiiSnv5nfUSSMW7QsCrhFPS1l" }
      ]
    }
  ];

  function driveUrl(id){
    return "https://drive.google.com/uc?export=download&id=" + id;
  }

  // ---------- state ----------
  let currentPlaylistIndex = 0;
  let currentTrackIndex = -1;
  let repeatPlaylist = false;

  const audio = document.getElementById("audio");
  const tabsEl = document.getElementById("tabs");
  const playlistNameEl = document.getElementById("playlistName");
  const playlistMetaEl = document.getElementById("playlistMeta");
  const tracklistEl = document.getElementById("tracklist");
  const nowPlayingLabel = document.getElementById("nowPlayingLabel");
  const nowPlayingTitle = document.getElementById("nowPlayingTitle");
  const playBtn = document.getElementById("playBtn");
  const playIcon = document.getElementById("playIcon");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const repeatBtn = document.getElementById("repeatBtn");
  const seek = document.getElementById("seek");
  const timeCurrent = document.getElementById("timeCurrent");
  const timeTotal = document.getElementById("timeTotal");

  const ICON_PLAY = '<path d="M8 5v14l11-7z"/>';
  const ICON_PAUSE = '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';

  function formatTime(sec){
    if(!isFinite(sec)) return "0:00";
    const m = Math.floor(sec/60);
    const s = Math.floor(sec%60).toString().padStart(2,"0");
    return m+":"+s;
  }

  function renderTabs(){
    tabsEl.innerHTML = "";
    playlists.forEach((pl, i) => {
      const btn = document.createElement("button");
      btn.className = "tab" + (i===currentPlaylistIndex ? " active" : "");
      btn.textContent = pl.name;
      btn.onclick = () => {
        currentPlaylistIndex = i;
        currentTrackIndex = -1;
        audio.pause();
        renderAll();
        if(playlists[i].tracks.length > 0){
          playTrack(i, 0);
        }
      };
      tabsEl.appendChild(btn);
    });
  }

  function renderPlaylist(){
    const pl = playlists[currentPlaylistIndex];
    playlistNameEl.textContent = pl.name;
    playlistMetaEl.textContent = pl.tracks.length + " เพลง";

    tracklistEl.innerHTML = "";
    pl.tracks.forEach((track, i) => {
      const li = document.createElement("li");
      li.className = "track" + (i===currentTrackIndex ? " playing" : "");
      li.innerHTML =
        '<span class="track-index">' + (i+1).toString().padStart(2,"0") + '</span>' +
        '<span class="track-title">' + track.title + '</span>' +
        '<svg class="track-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
      li.onclick = () => playTrack(currentPlaylistIndex, i);
      tracklistEl.appendChild(li);
    });
  }

  function renderAll(){
    renderTabs();
    renderPlaylist();
  }

  const nowPlayingError = document.getElementById("nowPlayingError");

  function showError(msg){
    nowPlayingError.textContent = msg;
    nowPlayingError.style.display = "block";
  }
  function clearError(){
    nowPlayingError.style.display = "none";
    nowPlayingError.textContent = "";
  }

  function playTrack(playlistIndex, trackIndex){
    currentPlaylistIndex = playlistIndex;
    currentTrackIndex = trackIndex;
    const track = playlists[playlistIndex].tracks[trackIndex];

    clearError();
    audio.src = driveUrl(track.driveId);
    audio.play().catch((err) => {
      showError("เล่นเพลงนี้ไม่ได้ (" + track.title + ") — ลองเช็คลิงก์ Drive อีกครั้ง");
    });

    nowPlayingLabel.textContent = "กำลังเล่นจาก " + playlists[playlistIndex].name;
    nowPlayingTitle.textContent = track.title;

    renderPlaylist();
  }

  function togglePlay(){
    if(currentTrackIndex === -1){
      if(playlists[currentPlaylistIndex].tracks.length > 0){
        playTrack(currentPlaylistIndex, 0);
      }
      return;
    }
    if(audio.paused){
      audio.play().catch(()=>{});
    } else {
      audio.pause();
    }
  }

  function playNext(){
    const tracks = playlists[currentPlaylistIndex].tracks;
    if(currentTrackIndex < tracks.length - 1){
      playTrack(currentPlaylistIndex, currentTrackIndex + 1);
    } else if(repeatPlaylist){
      playTrack(currentPlaylistIndex, 0);
    } else {
      audio.pause();
    }
  }

  function playPrev(){
    if(audio.currentTime > 3){
      audio.currentTime = 0;
      return;
    }
    if(currentTrackIndex > 0){
      playTrack(currentPlaylistIndex, currentTrackIndex - 1);
    } else {
      audio.currentTime = 0;
    }
  }

  // ---------- events ----------
  playBtn.onclick = togglePlay;
  nextBtn.onclick = playNext;
  prevBtn.onclick = playPrev;

  repeatBtn.onclick = () => {
    repeatPlaylist = !repeatPlaylist;
    repeatBtn.classList.toggle("on", repeatPlaylist);
  };

  audio.addEventListener("play", () => {
    playIcon.outerHTML = '<svg id="playIcon" viewBox="0 0 24 24" fill="currentColor">'+ICON_PAUSE+'</svg>';
  });
  audio.addEventListener("pause", () => {
    const el = document.getElementById("playIcon");
    if(el) el.outerHTML = '<svg id="playIcon" viewBox="0 0 24 24" fill="currentColor">'+ICON_PLAY+'</svg>';
  });
  audio.addEventListener("ended", playNext);
  audio.addEventListener("error", () => {
    const track = playlists[currentPlaylistIndex]?.tracks[currentTrackIndex];
    if(track){
      showError("โหลดเพลงนี้ไม่ได้ (" + track.title + ") — เช็คสิทธิ์แชร์ลิงก์ Drive หรือชื่อไฟล์");
    }
  });

  audio.addEventListener("loadedmetadata", () => {
    seek.max = audio.duration || 0;
    timeTotal.textContent = formatTime(audio.duration);
  });
  audio.addEventListener("timeupdate", () => {
    if(!seek.matches(":active")){
      seek.value = audio.currentTime;
    }
    timeCurrent.textContent = formatTime(audio.currentTime);
  });
  seek.addEventListener("input", () => {
    audio.currentTime = seek.value;
  });

  // media session (lock-screen controls where supported)
  if("mediaSession" in navigator){
    navigator.mediaSession.setActionHandler("play", togglePlay);
    navigator.mediaSession.setActionHandler("pause", togglePlay);
    navigator.mediaSession.setActionHandler("previoustrack", playPrev);
    navigator.mediaSession.setActionHandler("nexttrack", playNext);
  }

  renderAll();
</script>

</body>
</html>
